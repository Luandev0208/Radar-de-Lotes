name: Gerar Release privada

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - PROJETO/VERSION

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar versão final
        shell: pwsh
        run: |
          $version = (Get-Content PROJETO/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION deve conter uma versão final X.Y.Z." }
      - run: python -m pip install -r requirements-dev.txt
        working-directory: PROJETO
      - run: python -m pytest -q
        working-directory: PROJETO

  build-release:
    needs: test-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Gerar instalador limpo
        shell: cmd
        working-directory: PROJETO
        run: build_windows.bat
      - name: Gerar SHA-256
        shell: pwsh
        run: |
          $file = "PROJETO/installer_output/Instalar Radar de Lotes.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          "$hash  Instalar Radar de Lotes.exe" | Set-Content -Encoding ascii "PROJETO/installer_output/SHA256SUMS.txt"
      - name: Guardar pacote validado
        uses: actions/upload-artifact@v4
        with:
          name: radar-de-lotes-windows
          path: |
            PROJETO/installer_output/Instalar Radar de Lotes.exe
            PROJETO/installer_output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publicar Release privada
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content PROJETO/VERSION -Raw).Trim()
          $installer = "PROJETO/installer_output/Instalar Radar de Lotes.exe#Instalar Radar de Lotes.exe"
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$version" $installer "PROJETO/installer_output/SHA256SUMS.txt" `
              --repo "${{ github.repository }}" --clobber
          } else {
            gh release create "v$version" $installer "PROJETO/installer_output/SHA256SUMS.txt" `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "Radar de Lotes v$version" `
              --notes-file PROJETO/RELEASE_NOTES.md `
              --latest
          }
