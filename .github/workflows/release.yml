name: Gerar Release pública

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - PROJETO/VERSION

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: PROJETO/requirements-dev.txt
      - name: Validar versão final
        shell: pwsh
        run: |
          $version = (Get-Content PROJETO/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION deve conter uma versão final X.Y.Z." }
      - run: python -m pip install -r requirements-dev.txt
        working-directory: PROJETO
      - run: python -m pytest -q
        working-directory: PROJETO

  build-release:
    needs: test-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: PROJETO/requirements-dev.txt
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Gerar instaladores
        shell: cmd
        working-directory: PROJETO
        run: build_windows.bat
      - name: Gerar SHA-256
        shell: pwsh
        run: |
          $files = @(
            "PROJETO/installer_output/Instalar Radar de Lotes.exe",
            "PROJETO/installer_output/Radar-de-Lotes-Instalador-Compatibilidade.zip"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            $name = [IO.Path]::GetFileName($file)
            "$hash  $name"
          }
          $lines | Set-Content -Encoding ascii "PROJETO/installer_output/SHA256SUMS.txt"
      - name: Guardar pacote validado
        uses: actions/upload-artifact@v4
        with:
          name: radar-de-lotes-windows
          path: |
            PROJETO/installer_output/Instalar Radar de Lotes.exe
            PROJETO/installer_output/Radar-de-Lotes-Instalador-Compatibilidade.zip
            PROJETO/installer_output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publicar Release pública
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content PROJETO/VERSION -Raw).Trim()
          $assets = @(
            "PROJETO/installer_output/Instalar Radar de Lotes.exe#Instalar Radar de Lotes.exe",
            "PROJETO/installer_output/Radar-de-Lotes-Instalador-Compatibilidade.zip",
            "PROJETO/installer_output/SHA256SUMS.txt"
          )
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$version" @assets --repo "${{ github.repository }}" --clobber
          } else {
            gh release create "v$version" @assets --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Radar de Lotes v$version" --notes-file PROJETO/RELEASE_NOTES.md --latest
          }
