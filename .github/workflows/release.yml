name: Gerar Release privada

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build-release:
    needs: test-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Gerar instalador limpo
        shell: cmd
        run: build_windows.bat
      - name: Gerar SHA-256
        shell: pwsh
        run: |
          $file = "installer_output/Instalar Radar de Lotes.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          "$hash  Instalar Radar de Lotes.exe" | Set-Content -Encoding ascii "installer_output/SHA256SUMS.txt"
      - name: Publicar Release privada
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) { throw "A Release v$version já existe. Altere VERSION." }
          gh release create "v$version" `
            "installer_output/Instalar Radar de Lotes.exe" `
            "installer_output/SHA256SUMS.txt" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Radar de Lotes v$version" `
            --notes-file RELEASE_NOTES.md `
            --latest
